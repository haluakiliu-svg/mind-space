<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="docTitle">— MIND SPACE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;700&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<style>
  :root{--black:#0a0a0a;--white:#f0ede8;--orange:#ff4d00;--gray:#1a1a1a;--gray2:#2a2a2a;--text-muted:#666;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--black);color:var(--white);font-family:'Noto Sans TC',sans-serif;font-weight:300;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");opacity:0.025;pointer-events:none;z-index:1000;}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:linear-gradient(to bottom,rgba(10,10,10,0.95),transparent);}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:0.15em;color:var(--white);text-decoration:none;}
  .nav-back{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.2em;color:var(--text-muted);text-decoration:none;text-transform:uppercase;transition:color 0.2s;}
  .nav-back:hover{color:var(--orange);}
  .page-header{padding:140px 40px 80px;border-bottom:1px solid var(--gray2);position:relative;overflow:hidden;}
  .page-icon{position:absolute;right:-20px;bottom:-60px;font-size:300px;color:rgba(255,77,0,0.04);user-select:none;line-height:1;}
  .page-tag{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);margin-bottom:20px;}
  .page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(60px,10vw,120px);line-height:0.9;margin-bottom:24px;}
  .page-desc{color:var(--text-muted);font-size:0.9rem;line-height:1.8;max-width:480px;}
  .posts-section{padding:60px 40px;}
  .section-label{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);margin-bottom:40px;display:flex;align-items:center;gap:16px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--gray2);}
  .posts-list{display:flex;flex-direction:column;gap:2px;}
  .post-card{background:var(--gray);display:grid;grid-template-columns:1fr auto;gap:24px;padding:40px;position:relative;overflow:hidden;transition:background 0.3s;cursor:pointer;}
  .post-card:hover{background:var(--gray2);}
  .post-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange);transform:scaleY(0);transition:transform 0.3s;transform-origin:bottom;}
  .post-card:hover::before{transform:scaleY(1);}
  .post-card.expanded{grid-template-columns:1fr;}
  .post-meta{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .post-tag{background:rgba(255,77,0,0.15);color:var(--orange);font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.1em;padding:4px 10px;}
  .post-date{font-family:'Space Mono',monospace;font-size:0.55rem;color:var(--text-muted);}
  .post-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(24px,3vw,40px);letter-spacing:0.05em;margin-bottom:12px;transition:color 0.3s;}
  .post-card:hover .post-title{color:var(--orange);}
  .post-excerpt{font-size:0.85rem;line-height:1.85;color:rgba(240,237,232,0.7);}
  .post-thumbnail{width:200px;height:140px;object-fit:cover;background:var(--black);flex-shrink:0;}
  .post-full-content{display:none;margin-top:24px;}
  .post-card.expanded .post-full-content{display:block;}
  .post-full-text{font-size:0.9rem;line-height:1.95;color:rgba(240,237,232,0.85);}
  .post-full-image{width:100%;margin:24px 0;display:block;}
  .post-video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin:24px 0;}
  .post-video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
  .post-expand-btn{position:absolute;bottom:20px;right:20px;font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.15em;color:var(--text-muted);text-transform:uppercase;transition:color 0.2s;}
  .post-card:hover .post-expand-btn{color:var(--orange);}
  .loading{text-align:center;padding:60px;font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--text-muted);letter-spacing:0.15em;}
  .empty-state{text-align:center;padding:80px 40px;color:var(--text-muted);}
  .empty-state .big-char{font-size:80px;display:block;margin-bottom:20px;opacity:0.2;}
  .empty-state p{font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;}
  @media(max-width:768px){nav{padding:16px 20px;}.page-header,.posts-section{padding-left:20px;padding-right:20px;}.post-card{grid-template-columns:1fr;padding:24px;}.post-thumbnail{width:100%;height:200px;}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">MIND SPACE</a>
  <a href="index.html" class="nav-back">← Back</a>
</nav>
<header class="page-header">
  <div class="page-icon" id="pageIcon"></div>
  <p class="page-tag" id="pageTag"></p>
  <h1 class="page-title" id="pageTitle"></h1>
  <p class="page-desc" id="pageDesc"></p>
</header>
<section class="posts-section">
  <p class="section-label" id="sectionLabel"></p>
  <div class="posts-list" id="postsList">
    <div class="loading">載入中...</div>
  </div>
</section>
<script>
  const pageConfig = {
    explore:{tag:'// 02 — EXPLORE',title:'我在<br>探索世界',desc:'旅行的足跡、城市的溫度、異文化的衝擊。',icon:'◎',label:'探索記錄 — Exploration Journal',docTitle:'我在探索世界 — MIND SPACE'},
    tech:{tag:'// 03 — TECH & INVESTMENT',title:'科技投資<br>思考',desc:'科技趨勢的觀察、投資邏輯的梳理、產業變革的思考。',icon:'◈',label:'思考記錄 — Tech Thoughts',docTitle:'科技投資思考 — MIND SPACE'},
    marketing:{tag:'// 04 — MARKETING',title:'行銷專案<br>思考',desc:'品牌策略、消費者洞察、創意執行。',icon:'◉',label:'行銷記錄 — Marketing Cases',docTitle:'行銷專案思考 — MIND SPACE'}
  };

  const path = window.location.pathname;
  let category = 'explore';
  if (path.includes('tech')) category = 'tech';
  else if (path.includes('marketing')) category = 'marketing';

  const cfg = pageConfig[category];
  document.title = cfg.docTitle;
  document.getElementById('docTitle').textContent = cfg.docTitle;
  document.getElementById('pageTag').textContent = cfg.tag;
  document.getElementById('pageTitle').innerHTML = cfg.title;
  document.getElementById('pageDesc').textContent = cfg.desc;
  document.getElementById('pageIcon').textContent = cfg.icon;
  document.getElementById('sectionLabel').textContent = cfg.label;

  async function loadPosts() {
    const list = document.getElementById('postsList');
    try {
      const posts = await fetchPosts(category);
      if (!posts.length) {
        list.innerHTML = `<div class="empty-state">
          <span class="big-char">${cfg.icon}</span>
          <p>還沒有文章。<br>前往後台新增第一篇吧！</p>
          <br><a href="admin.html" style="color:var(--orange);font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.2em;">→ 前往後台上稿</a>
        </div>`;
        return;
      }
      list.innerHTML = posts.map((post, i) => `
        <article class="post-card" id="card-${i}" onclick="toggleCard(${i}, ${!!post.image_url})">
          <div>
            <div class="post-meta">
              ${post.tag ? `<span class="post-tag">${post.tag}</span>` : ''}
              <span class="post-date">${formatDate(post.created_at)}</span>
            </div>
            <h2 class="post-title">${post.title}</h2>
            <p class="post-excerpt">${post.content.substring(0,120)}...</p>
            <div class="post-full-content">
              <p class="post-full-text">${post.content.replace(/\n/g,'<br>')}</p>
              ${post.image_url ? `<img class="post-full-image" src="${post.image_url}" alt="">` : ''}
              ${post.video_url ? `<div class="post-video-wrap"><iframe src="${getYouTubeEmbed(post.video_url)}" allowfullscreen></iframe></div>` : ''}
            </div>
            <span class="post-expand-btn">閱讀更多 →</span>
          </div>
          ${post.image_url ? `<img class="post-thumbnail" src="${post.image_url}" alt="">` : ''}
        </article>
      `).join('');
    } catch(e) {
      list.innerHTML = `<div class="empty-state"><p>載入失敗，請確認 Supabase 設定。</p></div>`;
    }
  }

  function toggleCard(i) {
    const card = document.getElementById('card-' + i);
    card.classList.toggle('expanded');
    const btn = card.querySelector('.post-expand-btn');
    btn.textContent = card.classList.contains('expanded') ? '收起 ↑' : '閱讀更多 →';
  }

  loadPosts();
</script>
</body>
</html>
