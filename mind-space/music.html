<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我在聽音樂 — MIND SPACE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;700&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<style>
  :root{--black:#0a0a0a;--white:#f0ede8;--orange:#ff4d00;--gray:#1a1a1a;--gray2:#2a2a2a;--text-muted:#666;--green:#1db954;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--black);color:var(--white);font-family:'Noto Sans TC',sans-serif;font-weight:300;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");opacity:0.025;pointer-events:none;z-index:1000;}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:linear-gradient(to bottom,rgba(10,10,10,0.95),transparent);}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:0.15em;color:var(--white);text-decoration:none;}
  .nav-back{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.2em;color:var(--text-muted);text-decoration:none;text-transform:uppercase;transition:color 0.2s;}
  .nav-back:hover{color:var(--orange);}
  .page-header{padding:140px 40px 80px;border-bottom:1px solid var(--gray2);position:relative;overflow:hidden;}
  .page-header::before{content:'♪';position:absolute;right:-20px;bottom:-60px;font-size:300px;color:rgba(255,77,0,0.04);user-select:none;}
  .page-tag{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);margin-bottom:20px;}
  .page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(60px,10vw,120px);line-height:0.9;margin-bottom:24px;}
  .page-desc{color:var(--text-muted);font-size:0.9rem;line-height:1.8;max-width:480px;}
  .spotify-section{padding:60px 40px;border-bottom:1px solid var(--gray2);background:linear-gradient(135deg,rgba(29,185,84,0.03) 0%,transparent 60%);}
  .spotify-header{display:flex;align-items:center;gap:16px;margin-bottom:40px;}
  .spotify-icon{width:40px;height:40px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .spotify-label{font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--green);}
  .spotify-embed-wrapper{background:var(--gray);border:1px solid var(--gray2);padding:4px;margin-bottom:32px;}
  .spotify-embed-wrapper iframe{width:100%;border:none;display:block;}
  .spotify-input-group{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .spotify-url-input{flex:1;min-width:200px;background:var(--gray);border:1px solid var(--gray2);color:var(--white);font-family:'Space Mono',monospace;font-size:0.7rem;padding:12px 16px;outline:none;transition:border-color 0.2s;}
  .spotify-url-input:focus{border-color:var(--orange);}
  .spotify-url-input::placeholder{color:var(--text-muted);}
  .btn-load{background:var(--orange);color:var(--black);border:none;padding:12px 24px;font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;}
  .btn-load:hover{background:#ff6620;}
  .notes-section{padding:60px 40px;}
  .section-label{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);margin-bottom:40px;display:flex;align-items:center;gap:16px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--gray2);}
  .notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2px;}
  .note-card{background:var(--gray);padding:32px;position:relative;overflow:hidden;transition:background 0.3s;}
  .note-card:hover{background:var(--gray2);}
  .note-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange);transform:scaleY(0);transition:transform 0.3s;transform-origin:bottom;}
  .note-card:hover::before{transform:scaleY(1);}
  .note-song-meta{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .note-cover{width:56px;height:56px;object-fit:cover;background:var(--black);flex-shrink:0;}
  .note-song-info{flex:1;min-width:0;}
  .note-song-name{font-family:'Space Mono',monospace;font-size:0.75rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
  .note-artist{font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--text-muted);}
  .note-date{font-family:'Space Mono',monospace;font-size:0.55rem;color:var(--text-muted);position:absolute;top:20px;right:20px;}
  .note-mood{display:inline-block;background:rgba(255,77,0,0.15);color:var(--orange);font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;padding:4px 10px;margin-bottom:16px;}
  .note-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;margin-bottom:12px;letter-spacing:0.05em;}
  .note-text{font-size:0.85rem;line-height:1.85;color:rgba(240,237,232,0.8);}
  .note-image{width:100%;margin-top:16px;display:block;}
  .note-video{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin-top:16px;}
  .note-video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
  .loading{text-align:center;padding:60px;font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--text-muted);letter-spacing:0.15em;}
  .loading::after{content:'';animation:dots 1.2s infinite;}
  @keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
  .empty-state{text-align:center;padding:80px 40px;color:var(--text-muted);grid-column:1/-1;}
  .empty-state .big-char{font-size:80px;display:block;margin-bottom:20px;opacity:0.2;}
  .empty-state p{font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;}
  .error-msg{background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.3);color:#ff6666;padding:12px 16px;font-family:'Space Mono',monospace;font-size:0.65rem;margin-bottom:20px;display:none;}
  @media(max-width:768px){nav{padding:16px 20px;}.page-header,.spotify-section,.notes-section{padding-left:20px;padding-right:20px;}.notes-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">MIND SPACE</a>
  <a href="index.html" class="nav-back">← Back</a>
</nav>
<header class="page-header">
  <p class="page-tag">// 01 — MUSIC</p>
  <h1 class="page-title">我在<br>聽音樂</h1>
  <p class="page-desc">每一首歌都是情感的座標。這裡記錄我與音樂相遇的瞬間，以及那個瞬間我的心理狀態。</p>
</header>
<section class="spotify-section">
  <div class="spotify-header">
    <div class="spotify-icon">♫</div>
    <span class="spotify-label">Spotify Playlist</span>
  </div>
  <div class="error-msg" id="configError">
    ⚠ 請先在 supabase.js 填入你的 Supabase URL 和 API Key
  </div>
  <div class="spotify-embed-wrapper">
    <iframe id="spotifyPlayer"
      src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator&theme=0"
      height="380" frameBorder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy"></iframe>
  </div>
  <div class="spotify-input-group">
    <input class="spotify-url-input" id="spotifyUrl" type="text"
      placeholder="貼上 Spotify 歌單或歌曲連結...">
    <button class="btn-load" onclick="loadSpotify()">載入播放</button>
  </div>
</section>
<section class="notes-section">
  <p class="section-label">心情筆記 — Mood Notes</p>
  <div class="notes-grid" id="notesGrid">
    <div class="loading" style="grid-column:1/-1;">載入中</div>
  </div>
</section>
<script>
  // Check config
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    document.getElementById('configError').style.display = 'block';
  }

  // Spotify embed
  function loadSpotify() {
    const url = document.getElementById('spotifyUrl').value.trim();
    if (!url) return;
    let embedUrl = url.replace('open.spotify.com/', 'open.spotify.com/embed/').split('?')[0] + '?utm_source=generator&theme=0';
    document.getElementById('spotifyPlayer').src = embedUrl;
    localStorage.setItem('ms_spotify_url', url);
  }
  const savedUrl = localStorage.getItem('ms_spotify_url');
  if (savedUrl) { document.getElementById('spotifyUrl').value = savedUrl; }

  // Load posts from Supabase
  async function loadNotes() {
    const grid = document.getElementById('notesGrid');
    try {
      const posts = await fetchPosts('music');
      if (!posts.length) {
        grid.innerHTML = `<div class="empty-state">
          <span class="big-char">♪</span>
          <p>還沒有音樂筆記。<br>前往後台新增你的第一篇！</p>
          <br><a href="admin.html" style="color:var(--orange);font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.2em;">→ 前往後台上稿</a>
        </div>`;
        return;
      }
      grid.innerHTML = posts.map(post => `
        <div class="note-card">
          <span class="note-date">${formatDate(post.created_at)}</span>
          ${post.song_name ? `
          <div class="note-song-meta">
            ${post.cover_url
              ? `<img class="note-cover" src="${post.cover_url}" alt="cover">`
              : `<div class="note-cover" style="display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text-muted);">♪</div>`}
            <div class="note-song-info">
              <div class="note-song-name">${post.song_name}</div>
              <div class="note-artist">${post.artist || ''}</div>
            </div>
          </div>` : ''}
          ${post.mood ? `<span class="note-mood">${post.mood}</span>` : ''}
          <h3 class="note-title">${post.title}</h3>
          <p class="note-text">${post.content.replace(/\n/g,'<br>')}</p>
          ${post.image_url ? `<img class="note-image" src="${post.image_url}" alt="">` : ''}
          ${post.video_url ? `<div class="note-video"><iframe src="${getYouTubeEmbed(post.video_url)}" allowfullscreen></iframe></div>` : ''}
        </div>
      `).join('');
    } catch(e) {
      grid.innerHTML = `<div class="empty-state"><p>載入失敗，請確認 Supabase 設定。</p></div>`;
    }
  }
  loadNotes();
</script>
</body>
</html>
